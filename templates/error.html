{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}<section class="panel narrow error-page"><p class="eyebrow">ERROR {{ code }}</p><h1>Algo no salió como esperábamos</h1><p>{{ message }}</p><a class="btn primary" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Volver</a></section>{% endblock %}
